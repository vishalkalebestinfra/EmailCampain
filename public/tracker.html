<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Infra · Open tracker</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="utility-bar">
      <nav class="utility-inner" aria-label="App">
        <a href="/">Send</a>
        <a href="/tracker" class="active">Tracker</a>
      </nav>
    </div>
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/logo.svg" alt="Best Infra logo" width="50" height="47" />
        <div>
          <span class="wordmark"><span class="best">Best</span><span class="infra"> Infra</span></span>
          <p>Opens, Explore clicks, and unsubscribes</p>
        </div>
      </a>
      <button type="button" id="refreshBtn" class="btn ghost">Refresh</button>
    </header>

    <main>
      <div id="trackingWarning" class="notice warn" hidden></div>

      <section class="stats four">
        <article><span>Deliveries</span><strong id="statSent">0</strong></article>
        <article class="opened"><span>Opened</span><strong id="statOpened">0</strong></article>
        <article class="opens"><span>Total opens</span><strong id="statOpenCount">0</strong></article>
        <article class="expert"><span>Explore clicks</span><strong id="statExpert">0</strong></article>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h3>Email activity</h3>
            <p id="trackerCaption">Grouped by delivery with open counts and Explore clicks.</p>
          </div>
          <div class="toolbar">
            <label class="field filter-field" for="searchInput">
              <span>Search</span>
              <input id="searchInput" type="search" placeholder="Name, email, company…" />
            </label>
            <label class="field filter-field" for="templateFilter">
              <span>Template</span>
              <select id="templateFilter">
                <option value="">All templates</option>
              </select>
            </label>
          </div>
        </div>
        <div id="trackerList" class="activity-list">
          <div class="empty-card">Loading…</div>
        </div>
      </section>
    </main>
    <script src="/tracker.js"></script>
  </body>
</html>
